services:
  - type: web
    name: tiny_pixel
    runtime: image
    image:
      url: "ghcr.io/mjc-gh/tiny_pixel:0.0.2"
    region: virginia
    plan: starter
    numInstances: 1
    healthCheckPath: /up
    disk:
      name: db
      mountPath: /storage
      sizeGB: 2
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SECRET_KEY_BASE
        generateValue: true
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      - key: TP_DOMAIN_NAME
        sync: false
